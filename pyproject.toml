[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zloop"
version = "0.1.0"
description = "An asyncio event loop with a Zig core."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Marcelo Trylesinski", email = "marcelotryle@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Zig",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "coverage>=7.0",
    "ruff",
    "mypy",
    "trustme",
]
docs = [
    "zensical",
]

[tool.hatch.build.targets.wheel]
packages = ["zloop"]
artifacts = ["zloop/*.so"]

[tool.pytest.ini_options]
addopts = "-rxXs --strict-config --strict-markers"
asyncio_mode = "auto"
xfail_strict = true
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["zloop"]
branch = true
omit = ["zloop/_zloop*"]

[tool.coverage.report]
precision = 2
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "FA", "UP", "RUF100"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["zloop"]

[[tool.mypy.overrides]]
# The connection-setup layer deliberately widens the asyncio loop method
# signatures (Any / **_) the same way uvloop's stubs do; those intentional
# overrides and Any-returns aren't real type errors.
module = "zloop._io"
disable_error_code = ["override", "no-any-return"]
