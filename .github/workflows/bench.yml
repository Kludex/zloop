name: Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "bench_uvloop/**"
      - "src/**"
      - "zloop/**"
      - ".github/workflows/bench.yml"

permissions: {}

jobs:
  bench:
    name: Echo benchmark (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (incl. bench group)
        run: scripts/install

      - name: Build the extension
        run: ./build_ext.sh "$(pwd)/.venv/bin/python"

      - name: Run benchmark
        run: scripts/bench | tee "$GITHUB_STEP_SUMMARY"
