name: Benchmark

on:
  workflow_dispatch:
  # Run only on main, where the regenerated numbers are actually consumed (the
  # update-readme job opens the numbers PR). Running on PRs just burned CI minutes
  # on results that were thrown away.
  push:
    branches: ["main"]
    paths:
      - "bench_uvloop/**"
      - "src/**"
      - "zloop/**"
      - "docs/render_bench.py"
      - ".github/workflows/bench.yml"

permissions: {}

jobs:
  bench:
    name: Echo benchmark (Ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: read # clone the private repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (incl. bench group, builds the extension)
        run: scripts/install

      - name: Run benchmark
        run: |
          .venv/bin/python bench_uvloop/bench_ci.py --json bench_uvloop/results.json \
            | tee "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench_uvloop/results.json

  update-chart:
    name: Open benchmark chart PR
    needs: bench
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the regenerated files
      pull-requests: write # open the update PR
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-results
          path: bench_uvloop

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Render the chart from results
        run: uv run --with matplotlib python docs/render_bench.py

      - name: Open or update the benchmark PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bench/update-numbers
          commit-message: "Update benchmark chart from CI"
          title: "Update benchmark chart"
          body: |
            Regenerated `docs/assets/echo-bench.svg` from the latest CI echo
            benchmark. The README and docs performance tables are curated by hand
            (they also cover the io_uring and free-threaded results, which this
            single-loop run does not measure).

            Source of truth: `bench_uvloop/results.json`.
          add-paths: |
            docs/assets/echo-bench.svg
            bench_uvloop/results.json
