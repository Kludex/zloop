name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read # clone the private repo
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.12", "3.13", "3.14"]
        # Free-threaded leg (Ubuntu only): verifies zloop runs GIL-free.
        include:
          - os: "ubuntu-latest"
            python-version: "3.14t"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true

      # The free-threaded leg skips the docs group: zensical has no free-threaded
      # wheel and can't build from source there.
      - name: Install dependencies
        run: scripts/install
        env:
          ZLOOP_SYNC_GROUPS: "${{ matrix.python-version == '3.14t' && '--group dev --group bench' || '' }}"

      - name: Run checks
        if: "${{ matrix.os == 'ubuntu-latest' && matrix.python-version != '3.14t' }}"
        run: scripts/check

      - name: Build the Zig core, extension, and docs
        run: scripts/build
        env:
          ZLOOP_SKIP_DOCS: "${{ matrix.python-version == '3.14t' && '1' || '' }}"

      - name: Assert the GIL is disabled (free-threaded leg)
        if: "${{ matrix.python-version == '3.14t' }}"
        run: |
          .venv/bin/python -c "import sys, zloop; assert sys._is_gil_enabled() is False, 'GIL was re-enabled; SetGIL declaration missing or failed'"

      - name: Run tests
        run: scripts/test

      - name: Enforce coverage
        run: scripts/coverage

  # https://github.com/marketplace/actions/alls-green#why
  check:
    name: All green
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@afee1c1eac2a506084c274e9c02c8e0687b48d9e # v1.2.2
        with:
          jobs: "${{ toJSON(needs) }}"
